
name: CI

on:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: develop-armak-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  # crenya's shared Frappe CI: own ports + bench per job on crenya-ci, a saved Frappe/ERPNext site,
  # fails when no tests ran. One fix there reaches every app.
  tests:
    uses: exvas/ci-workflows/.github/workflows/frappe-app.yml@v1
    with:
      app: armak
      frappe_versions: '["version-15"]'
      draft_frappe_versions: '["version-15"]'
      hrms: true
      runs_on: '"ubuntu-latest"'
      require_tests: true
      # the tests build their own data on the setup-wizard company; ERPNext's test-record tree
      # needs apps this bench does not install (Payment Gateway)
      run_tests_args: "--skip-test-records"
